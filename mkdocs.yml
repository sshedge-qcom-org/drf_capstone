site_name: Business English for Senior Engineers
site_description: A daily Business-English lesson corpus rendered from raw_data.

theme:
  name: material
  features:
    - navigation.top
    - navigation.sections
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - attr_list
  - toc:
      permalink: true

plugins:
  - search

# docs/*.md are generated by `manage.py export_docs`.
nav:
  - Home: index.md
  - Day 1 — System design: day-1.md
  - Day 2 — Code reviews: day-2.md
  - Day 3 — Production issues: day-3.md
  - Day 4 — Sprint planning: day-4.md
